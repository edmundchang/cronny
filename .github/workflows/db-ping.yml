name: Daily DB Ping

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflare-aware HTTP client
        run: python -m pip install --disable-pip-version-check --quiet cloudscraper

      - name: Hit db-ping
        env:
          DB_PING_URL: https://trurank.developable.app/api/db-ping
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import cloudscraper

          url = os.environ["DB_PING_URL"]
          scraper = cloudscraper.create_scraper(
              browser={"browser": "chrome", "platform": "linux", "desktop": True}
          )
          headers = {"Accept": "text/html,application/json"}
          last_exc = None

          for attempt in range(1, 4):
              try:
                  response = scraper.get(url, headers=headers, timeout=30)
                  print(f"HTTP {response.status_code}")

                  if 200 <= response.status_code < 300:
                      print("db-ping succeeded")
                      sys.exit(0)

                  server = response.headers.get("server", "")
                  print(f"Server: {server}")
                  print(f"Response preview: {response.text[:500].replace(chr(10), ' ')}")
                  response.raise_for_status()
              except Exception as exc:
                  last_exc = exc
                  if attempt < 3:
                      time.sleep(5 * attempt)
                      continue

          print(f"db-ping failed after retries: {last_exc}", file=sys.stderr)
          sys.exit(1)
          PY
