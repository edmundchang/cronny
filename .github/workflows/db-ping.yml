name: Daily Pings

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: db-ping
            url: https://trurank.developable.app/api/db-ping
          - name: landing-news
            url: https://developable.app/landing/news.php
    steps:
      - name: Install Cloudflare-aware HTTP client
        run: python -m pip install --disable-pip-version-check --quiet cloudscraper

      - name: Hit ${{ matrix.name }}
        env:
          PING_NAME: ${{ matrix.name }}
          PING_URL: ${{ matrix.url }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import cloudscraper

          name = os.environ["PING_NAME"]
          url = os.environ["PING_URL"]
          scraper = cloudscraper.create_scraper(
              browser={"browser": "chrome", "platform": "linux", "desktop": True}
          )
          headers = {"Accept": "text/html,application/json"}
          last_exc = None

          for attempt in range(1, 4):
              try:
                  response = scraper.get(url, headers=headers, timeout=30)
                  print(f"HTTP {response.status_code}")

                  if 200 <= response.status_code < 300:
                      print(f"{name} succeeded")
                      sys.exit(0)

                  server = response.headers.get("server", "")
                  print(f"Server: {server}")
                  print(f"Response preview: {response.text[:500].replace(chr(10), ' ')}")
                  response.raise_for_status()
              except Exception as exc:
                  last_exc = exc
                  if attempt < 3:
                      time.sleep(5 * attempt)
                      continue

          print(f"{name} failed after retries: {last_exc}", file=sys.stderr)
          sys.exit(1)
          PY
