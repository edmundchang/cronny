name: Daily DB Ping

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Hit db-ping
        run: |
          curl -fsS --max-time 30 -w "HTTP %{http_code}\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 KeepAlive/1.0" \
            -H "Accept: text/html,application/json" \
            https://trurank.developable.app/api/db-ping
