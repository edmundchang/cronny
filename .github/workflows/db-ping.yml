name: Daily DB Ping

"on":
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping trurank API
        run: |
          curl --fail --show-error --silent --location \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            https://trurank.developable.app/api/db-ping
